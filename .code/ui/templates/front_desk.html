<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フロントデスク - HRS 管理画面</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ============ ログイン画面 ============ -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <h1>HRS フロントデスク</h1>
            <p class="login-subtitle">管理者ログイン</p>
            <div class="form-group">
                <label for="login-password">パスワード</label>
                <input type="password" id="login-password" class="input-text" placeholder="パスワードを入力" autocomplete="current-password">
            </div>
            <button class="btn btn-primary btn-block" onclick="login()">ログイン</button>
            <div id="login-message" class="message"></div>
        </div>
    </div>

    <!-- ============ 管理画面本体 ============ -->
    <div id="app" class="app hidden">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-title">HRS</div>
                <div class="sidebar-subtitle">Front Desk</div>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-view="reservations-view" onclick="switchView('reservations-view')">予約一覧</button>
                <button class="nav-btn" data-view="checkin-view" onclick="switchView('checkin-view')">チェックイン</button>
                <button class="nav-btn" data-view="checkout-view" onclick="switchView('checkout-view')">チェックアウト</button>
            </nav>
            <button class="nav-btn logout-btn" onclick="logout()">ログアウト</button>
        </aside>

        <!-- メインコンテンツ -->
        <main class="main-content">

            <!-- ===== 予約一覧 ===== -->
            <section id="reservations-view" class="view active">
                <div class="view-header">
                    <h2>予約一覧</h2>
                    <button class="btn btn-secondary" onclick="loadReservations()">更新</button>
                </div>
                <div class="filter-bar">
                    <input type="text" id="res-filter-number" class="input-text" placeholder="予約番号で検索" oninput="renderReservations()">
                    <input type="text" id="res-filter-name" class="input-text" placeholder="予約名で検索" oninput="renderReservations()">
                    <input type="date" id="res-filter-date" class="input-text" oninput="renderReservations()">
                </div>
                <div id="reservations-list" class="table-wrap">
                    <p class="placeholder">「更新」で予約を読み込みます</p>
                </div>
            </section>

            <!-- ===== チェックイン ===== -->
            <section id="checkin-view" class="view">
                <div class="view-header">
                    <h2>チェックイン（本日の予約）</h2>
                    <button class="btn btn-secondary" onclick="loadCheckinCandidates()">更新</button>
                </div>
                <div class="filter-bar">
                    <input type="text" id="ci-filter-number" class="input-text" placeholder="予約番号で検索" oninput="renderCheckin()">
                    <input type="text" id="ci-filter-name" class="input-text" placeholder="予約名で検索" oninput="renderCheckin()">
                </div>
                <div id="checkin-list" class="table-wrap">
                    <p class="placeholder">「更新」で本日の予約を読み込みます</p>
                </div>
            </section>

            <!-- ===== チェックアウト ===== -->
            <section id="checkout-view" class="view">
                <div class="view-header">
                    <h2>チェックアウト（宿泊中）</h2>
                    <button class="btn btn-secondary" onclick="loadCheckoutCandidates()">更新</button>
                </div>
                <div class="filter-bar">
                    <input type="text" id="co-filter-room" class="input-text" placeholder="部屋番号で検索" oninput="renderCheckout()">
                </div>
                <div id="checkout-list" class="table-wrap">
                    <p class="placeholder">「更新」で宿泊中の予約を読み込みます</p>
                </div>
            </section>

        </main>
    </div>

    <!-- ============ 詳細モーダル ============ -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">予約詳細</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-message" class="message"></div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>

    <!-- ============ ローディング ============ -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>処理中...</p>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
